name: CI

# Neden: testler bugüne dek YALNIZCA geliştiricinin makinesinde ELLE koşuyordu. Unutulan bir koşu =
# bozuk kodun doğrudan canlıya gitmesi (Railway main'i otomatik deploy ediyor). Bu iş akışı her
# push'ta sıfırdan bir makinede tip kontrolü + 93 kontrollük smoke testini gerçek PostgreSQL'e karşı
# koşar. Kırmızı yanarsa bildirim gelir ve düzeltmeden ilerlemeyiz.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # GECELİK: stress (yük/eşzamanlılık) uzun sürdüğü için her push'ta koşmuyor. Ama "nightly'ye
  # bırakıldı" denip ZAMANLANMIŞ İŞ HİÇ TANIMLANMAMIŞTI → stress aylarca hiç koşmadı ve bu sırada
  # puan modeli değişince (tur 19: puan rezervasyonda değil check-in'de) iki testi bayatlayıp
  # kırıldı, kimse görmedi. Artık gerçekten her gece koşuyor. 02:00 UTC = 05:00 İstanbul.
  schedule:
    - cron: '0 2 * * *'

# Aynı dalda üst üste push gelirse önceki koşuyu iptal et (dakika israfı olmasın)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: statik kontroller (tip + şema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: TypeScript (src) — strict
        run: npx tsc --noEmit
      - name: TypeScript (src + scripts + prisma)
        # Ana tsconfig yalnızca src/** kapsıyordu → smoke(182KB)/fuzz/stress/chaos/seed HİÇ tip
        # denetiminden geçmiyordu. Test kodundaki tip hatası, testin yanlış şeyi doğrulamasına yol açar.
        run: npm run typecheck:ci
      - name: prisma şeması geçerli mi
        run: npx prisma validate

      # API SÖZLEŞMESİ DAMGASI: src/types/api.ts üç repoda da BİREBİR aynı olmalı. Damga
      # içeriğin hash'i olduğu için, damgaları eşit olan iki dosya kanıtlanabilir şekilde aynıdır.
      # Bir repoda değişip diğerlerinde değişmezse uyuşmazlık yine derleyiciden kaçardı.
      - name: API sözleşmesi damgası (backend ↔ web ↔ mobil)
        run: npm run types:check

      # ÜÇ REPO ARASINDA SÜREÇ PARİTESİ (13 Ağu 2026): web'de lint vardı, mobilde ve
      # backend'de YOKTU. Üstelik kodda `// eslint-disable-next-line ...` yorumları duruyordu —
      # birileri lint olduğunu varsayıp susturucu yazmış ama koşan bir lint hiç olmamış.
      # Duruş: HATALAR kırar, bilinen borç (any/kullanılmayan) UYARI kalır.
      - name: lint (hatalarda kırılır, bilinen borç uyarı)
        run: npx eslint .

  test:
    name: ${{ matrix.suite }} (gerçek PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40  # stress (gecelik) diğerlerinden uzun sürüyor
    strategy:
      fail-fast: false
      matrix:
        # Her harness KENDİ sunucusunu ayrı portta açıyor (smoke:3199, fuzz:3194, chaos:3197) ve
        # ID aralıkları da ayrı → paralel koşabilirler.
        # stress yalnız GECELİK + elle tetiklemede koşar (uzun sürüyor, her push'ta gereksiz).
        suite: ${{ fromJSON( (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["smoke","fuzz","chaos","stress"]' || '["smoke","fuzz","chaos"]' ) }}

    services:
      postgres:
        # Prod (Railway) PostgreSQL 18.4 kosuyor. CI 16 kalirsa surume bagli davranis
        # farklari (planlayici, yeni/degisen fonksiyonlar) CI'da YAKALANMAZ, canlida patlar.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitpass_ci
        ports: ['5432:5432']
        # Sağlık kontrolü olmadan adımlar DB hazır olmadan başlar ve rastgele kırmızı yanar
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitpass_ci
      # CI'ya özel SAHTE sırlar — gerçek sırlar burada YOK, olmamalı.
      # (Sunucu NODE_ENV=production iken sır yoksa fail-fast yapıyor; burada test modundayız.)
      JWT_SECRET: ci-only-fake-jwt-secret
      ADMIN_SECRET: ci-only-fake-admin-secret
      CRON_SECRET: ci-only-fake-cron-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: bağımlılıklar
        run: npm ci

      - name: prisma client üret
        run: npx prisma generate

      - name: şemayı CI veritabanına uygula
        # NOT: Prisma 7'de `--skip-generate` KALDIRILDI (yerel simülasyonda "unknown option" ile
        # patladığı için yakalandı). Datasource URL'si prisma.config.ts üzerinden DATABASE_URL'den okunur.
        run: npx prisma db push

      - name: temel veriyi ekle (kategori/ilçe — smoke bunları bekliyor)
        run: npm run seed

      - name: ${{ matrix.suite }} koşusu
        run: npm run ${{ matrix.suite }}
